name: 울산 동구 뉴스봇

on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'briefing 또는 check'
        default: 'briefing'

permissions:
  contents: write

concurrency:
  group: newsbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: 모드 결정
        id: mode
        run: |
          S="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$S" = "0 23 * * *" ] || [ "$S" = "30 9 * * *" ]; then
            echo "mode=briefing" >> $GITHUB_OUTPUT
          else
            echo "mode=check" >> $GITHUB_OUTPUT
          fi

      - name: 뉴스봇 실행
        timeout-minutes: 6
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_bot.py ${{ steps.mode.outputs.mode }}

      - name: 게시판 알림 실행
        timeout-minutes: 6
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notice_bot.py

      - name: 발송 기록 저장
        continue-on-error: true
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json notice_state.json
          git diff --cached --quiet && exit 0
          git commit -m "update state [skip ci]"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            git rebase --abort || true
            sleep 5
          done
          echo "push 실패 — 다음 실행에서 재시도"
