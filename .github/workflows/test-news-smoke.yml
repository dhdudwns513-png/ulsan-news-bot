name: Test news message edit check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/test-news-smoke.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send and edit one clearly labelled test message
        env:
          TEST_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
          TEST_CHAT: ${{ secrets.TEST_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, time
          token, chat_id = os.environ['TEST_TOKEN'], os.environ['TEST_CHAT']
          def call(method, payload):
              req = urllib.request.Request('https://api.telegram.org/bot' + token + '/' + method,
                  data=json.dumps(payload).encode(), headers={'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      data = json.load(r)
              except Exception:
                  raise SystemExit('TELEGRAM_ERROR_' + method) from None
              if not data.get('ok'):
                  raise SystemExit('TELEGRAM_REJECTED_' + method)
              return data['result']
          bot = call('getMe', {})
          if bot.get('username', '').lower() != 'kimtaeseon_news_test_0914_bot':
              raise SystemExit('WRONG_TEST_BOT')
          chat = call('getChat', {'chat_id': chat_id})
          if chat.get('type') != 'channel' or chat.get('title') != '김태선 뉴스봇 테스트':
              raise SystemExit('WRONG_TEST_CHANNEL')
          initial = '기능 점검 · 기사 묶음 메시지 갱신을 확인하고 있습니다.\n실제 뉴스가 아닌 테스트 메시지입니다.'
          message = call('sendMessage', {'chat_id': chat_id, 'text': initial, 'disable_notification': True})
          mid = message['message_id']
          print('TEST_MESSAGE_SENT id=' + str(mid))
          time.sleep(2)
          final = '기능 점검 완료 · 기존 메시지 수정에 성공했습니다.\n후속 기사를 같은 메시지에 반영할 수 있습니다.\n실제 뉴스가 아닌 테스트 메시지입니다.'
          edited = call('editMessageText', {'chat_id': chat_id, 'message_id': mid, 'text': final})
          if edited.get('message_id') != mid or edited.get('text') != final:
              raise SystemExit('EDIT_RESPONSE_MISMATCH')
          print('TEST_MESSAGE_EDIT_VERIFIED id=' + str(mid))
          print('NO_RECURRING_NEWS_DELIVERY_ENABLED')
          PY
